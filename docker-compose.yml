version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chatncollab-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongo:27017/chatncollab
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=supersecret_jwt_key_chatncollab_2026
      - GOOGLE_AI_KEY=${GOOGLE_AI_KEY:-AIzaSyDummyKeyForInitialization}
      - USE_MOCK_MONGO=false
      - USE_MOCK_REDIS=false
    depends_on:
      - mongo
      - redis

  mongo:
    image: mongo:6.0
    container_name: chatncollab-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:7-alpine
    container_name: chatncollab-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  mongo-data:
  redis-data:
